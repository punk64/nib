<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>落笔 · V2 效果预览</title>
<style>
:root{
  --r-s:9px; --r-m:13px; --r-l:18px; --r-xl:24px;
  --ease:cubic-bezier(.22,.9,.28,1);
}
html[data-theme="dark"]{
  --bg:#0b0c10; --card:#14161d; --card-2:#1b1e27; --card-3:#232733;
  --line:rgba(255,255,255,.065); --line-2:rgba(255,255,255,.12);
  --text:#f1f3f8; --text-2:#9aa3b4; --text-3:#69717f;
  --accent:#7c8cff; --accent-2:#a5b0ff; --accent-weak:rgba(124,140,255,.13);
  --danger:#ff6b6b; --danger-weak:rgba(255,107,107,.12);
  --ok:#34d399; --warn:#fbbf24;
  --glass:rgba(20,22,29,.78);
  --shadow:0 24px 60px -24px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.04);
  --desk-a:#243354; --desk-b:#0a0c12;
  --desk-text:#ffffff; --desk-sub:rgba(255,255,255,.55);
  --desk-glass:rgba(26,32,44,.6); --desk-line:rgba(255,255,255,.1);
  --page-a:#151b28; --page-b:#08090d;
}
html[data-theme="light"]{
  --bg:#fafbfd; --card:#ffffff; --card-2:#f3f5f9; --card-3:#e9ecf3;
  --line:rgba(17,24,44,.075); --line-2:rgba(17,24,44,.14);
  --text:#101526; --text-2:#5c6579; --text-3:#939cab;
  --accent:#4f5bd5; --accent-2:#3a45b8; --accent-weak:rgba(79,91,213,.085);
  --danger:#e5484d; --danger-weak:rgba(229,72,77,.09);
  --ok:#12a150; --warn:#b47400;
  --glass:rgba(255,255,255,.8);
  --shadow:0 24px 60px -30px rgba(24,36,70,.35), 0 0 0 1px rgba(17,24,44,.05);
  --desk-a:#dde5f2; --desk-b:#eef1f7;
  --desk-text:#131a2a; --desk-sub:rgba(19,26,42,.55);
  --desk-glass:rgba(255,255,255,.72); --desk-line:rgba(17,24,44,.08);
  --page-a:#eef1f7; --page-b:#dfe4ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(1000px 680px at 50% -8%, var(--page-a), var(--page-b) 75%);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  font-feature-settings:"tnum";
  transition:background .35s;
}
.phone{
  width:412px;height:868px;border-radius:54px;padding:9px;background:#08090c;
  box-shadow:var(--shadow);transform:scale(var(--scale,1));position:relative;
}
.screen{
  width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--bg);
  position:relative;display:flex;flex-direction:column;transition:background .3s;
}
.punch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:#000;z-index:120;box-shadow:0 0 0 1px rgba(255,255,255,.05);}
.statusbar{height:42px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:9px 26px 0;font-size:12.5px;font-weight:600;color:var(--text);letter-spacing:.2px;}
.sb-right{display:flex;gap:5px;align-items:center;}
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px 100px;scrollbar-width:none;}
.main::-webkit-scrollbar,.sh-body::-webkit-scrollbar{display:none;}

.tabbar{flex:none;height:70px;display:flex;align-items:flex-start;padding-top:8px;background:var(--glass);backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);border-top:1px solid var(--line);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:var(--text-3);font-size:10px;font-family:inherit;font-weight:500;cursor:pointer;position:relative;padding:0;}
.tab svg{width:21px;height:21px;transition:transform .2s var(--ease);}
.tab.on{color:var(--accent);}
.tab.on svg{transform:translateY(-1px);}
.tab.on::after{content:"";position:absolute;top:-9px;width:16px;height:2.5px;border-radius:2px;background:var(--accent);}
.fab{
  position:absolute;right:20px;bottom:86px;width:54px;height:54px;border-radius:19px;border:0;
  background:linear-gradient(150deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 14px 30px -10px rgba(124,140,255,.65), inset 0 1px 0 rgba(255,255,255,.25);
  z-index:20;transition:transform .15s var(--ease);
}
.fab:active{transform:scale(.91);}
.fab svg{width:24px;height:24px;}
.gesture{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:112px;height:4px;border-radius:2px;background:var(--text-3);opacity:.4;z-index:110;}

.hero{padding:18px 2px 4px;}
.hero-dow{font-size:12.5px;color:var(--accent);font-weight:600;letter-spacing:.6px;margin-bottom:5px;}
.hero-date{font-size:31px;font-weight:650;letter-spacing:-1.2px;color:var(--text);line-height:1.15;}
.hero-bar{display:flex;align-items:center;gap:9px;margin-top:14px;padding:12px 13px;background:var(--card);border-radius:var(--r-l);border:1px solid var(--line);}
.ring{position:relative;width:42px;height:42px;border-radius:50%;flex:none;background:conic-gradient(var(--accent) calc(var(--p,0) * 1%), var(--line-2) 0);}
.ring::before{content:"";position:absolute;inset:4.5px;border-radius:50%;background:var(--card);}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--text);}
.hero-info{flex:1;min-width:0;}
.hero-info b{display:block;font-size:13.5px;font-weight:550;color:var(--text);}
.hero-info span{display:block;font-size:11.5px;color:var(--text-3);margin-top:3px;}
.hero-info em{font-style:normal;color:var(--ok);}

.group{margin-top:20px;}
.gh{display:flex;align-items:center;gap:7px;padding:0 4px 9px;font-size:11.5px;font-weight:600;color:var(--text-3);letter-spacing:.3px;}
.gh em{width:5px;height:5px;border-radius:2px;background:var(--text-3);font-style:normal;}
.gh.over{color:var(--danger);}
.gh.over em{background:var(--danger);}
.gh b{margin-left:auto;font-weight:500;color:var(--text-3);font-size:11px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;}
.card>.row{border-bottom:1px solid var(--line);}
.card>.row:last-child{border-bottom:0;}
.row{display:flex;gap:12px;padding:13px 14px;position:relative;cursor:pointer;align-items:flex-start;transition:background .14s;}
.row:active{background:var(--card-2);}
.row.done{opacity:.45;}
.row[data-pri="1"]::before,.row[data-pri="2"]::before,.row[data-pri="3"]::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:2.5px;border-radius:0 2px 2px 0;}
.row[data-pri="1"]::before{background:var(--text-3);}
.row[data-pri="2"]::before{background:var(--warn);}
.row[data-pri="3"]::before{background:var(--danger);}
.cbox{
  flex:none;width:21px;height:21px;border-radius:50%;border:1.6px solid var(--line-2);background:transparent;
  margin-top:1px;cursor:pointer;display:grid;place-items:center;padding:0;transition:.18s var(--ease);color:#fff;
}
.cbox svg{width:12px;height:12px;opacity:0;transform:scale(.7);transition:.18s var(--ease);}
.cbox.on{background:var(--accent);border-color:var(--accent);}
.cbox.on svg{opacity:1;transform:scale(1);}
.rmain{flex:1;min-width:0;}
.rt{font-size:14.5px;line-height:1.45;color:var(--text);word-break:break-word;letter-spacing:-.1px;}
.row.done .rt{text-decoration:line-through;color:var(--text-2);}
.rmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;color:var(--text-3);}
.mi{display:inline-flex;align-items:center;gap:3.5px;}
.mi svg{width:11px;height:11px;stroke-width:1.9;}
.mi.hot{color:var(--danger);}
.mi.cal{color:var(--accent);}
.mi.bell{color:var(--accent);}
.tg{font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:500;}

.empty{text-align:center;padding:56px 20px;color:var(--text-3);}
.empty svg{width:34px;height:34px;opacity:.35;margin-bottom:14px;stroke-width:1.4;}
.empty p{margin:0;font-size:12.5px;line-height:1.8;}

.calhead{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 14px;}
.caltitle{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.2px;}
.calnav{display:flex;gap:6px;}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.caldow{text-align:center;font-size:10px;color:var(--text-3);padding:2px 0 8px;font-weight:600;}
.calcell{
  aspect-ratio:1;border:0;background:none;border-radius:11px;color:var(--text);font-size:13px;font-family:inherit;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;
  transition:background .14s;
}
.calcell:active{background:var(--card-2);}
.calcell.out{color:var(--text-3);opacity:.32;}
.calcell.today{color:var(--accent);font-weight:650;}
.calcell.sel{background:var(--accent);color:#fff;font-weight:600;}
.calcell.sel::after{display:none;}
.calcell .mk{width:4px;height:4px;border-radius:50%;background:var(--accent);position:absolute;bottom:7px;}
.calcell.sel .mk{background:#fff;}

.stat3{display:flex;gap:9px;margin:6px 0 20px;}
.stat3 div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 13px;}
.stat3 b{display:block;font-size:22px;font-weight:650;color:var(--text);letter-spacing:-.8px;line-height:1;}
.stat3 span{display:block;font-size:10.5px;color:var(--text-3);margin-top:6px;}

.sect{font-size:11px;font-weight:600;color:var(--text-3);padding:0 4px 9px;letter-spacing:.5px;display:flex;align-items:center;}
.sect span{font-weight:400;color:var(--text-3);opacity:.75;margin-left:6px;font-size:10.5px;letter-spacing:0;}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;color:var(--text);transition:background .14s;}
.li:last-child{border-bottom:0;}
.li:active{background:var(--card-2);}
.lic{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;flex:none;}
.lic svg{width:15px;height:15px;}
.li .sub{margin-left:auto;font-size:11.5px;color:var(--text-3);}
.li .chev{color:var(--text-3);flex:none;display:flex;}
.li .chev svg{width:14px;height:14px;opacity:.6;}
.switch{margin-left:auto;width:40px;height:23px;border-radius:12px;background:var(--card-3);border:0;position:relative;cursor:pointer;transition:.22s;flex:none;}
.switch::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.22s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch.on{background:var(--accent);}
.switch.on::after{transform:translateX(17px);}

.themes{display:flex;gap:9px;padding:2px 0 4px;}
.thm{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-m);padding:8px;cursor:pointer;font-family:inherit;transition:.18s;}
.thm.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak);}
.thm .sw{display:block;height:42px;border-radius:8px;margin-bottom:7px;border:1px solid var(--line);position:relative;overflow:hidden;}
.thm .sw i{position:absolute;left:8px;right:30px;height:4px;border-radius:2px;top:10px;opacity:.6;}
.thm .sw u{position:absolute;left:8px;right:14px;height:4px;border-radius:2px;top:20px;opacity:.35;}
.thm em{font-style:normal;font-size:11.5px;color:var(--text-2);font-weight:500;}
.thm.on em{color:var(--accent);}

.sheet{position:absolute;inset:0;background:var(--bg);z-index:70;transform:translateY(100%);transition:transform .34s var(--ease);display:flex;flex-direction:column;border-radius:46px;overflow:hidden;}
.sheet.open{transform:translateY(0);}
.sh-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:50px 16px 8px;gap:8px;}
.sh-title{font-size:12px;color:var(--text-3);font-weight:500;}
.ibtn{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--text-2);display:grid;place-items:center;cursor:pointer;transition:background .14s;}
.ibtn:active{background:var(--card-2);}
.ibtn svg{width:16px;height:16px;}
.save{border:0;background:var(--accent);color:#fff;font-family:inherit;font-size:13px;font-weight:600;padding:8px 17px;border-radius:11px;cursor:pointer;transition:opacity .14s;}
.save:active{opacity:.75;}
.sh-body{flex:1;overflow-y:auto;padding:6px 18px 24px;scrollbar-width:none;}
.sh-foot{flex:none;border-top:1px solid var(--line);background:var(--card);padding:10px 14px 16px;display:flex;gap:6px;}
.sh-foot .tool{flex:1;}

.qtitle{width:100%;border:0;background:none;color:var(--text);font-family:inherit;font-size:20px;font-weight:550;line-height:1.5;padding:10px 2px;outline:none;letter-spacing:-.2px;}
.qtitle::placeholder{color:var(--text-3);font-weight:400;}
.qbody{width:100%;border:0;background:none;color:var(--text-2);font-family:inherit;font-size:13.5px;line-height:1.7;padding:6px 2px;outline:none;resize:none;min-height:80px;}
.qbody::placeholder{color:var(--text-3);}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 2px 2px;min-height:14px;}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:4px 9px;border-radius:7px;background:var(--accent-weak);color:var(--accent);font-weight:500;}
.chip svg{width:11px;height:11px;stroke-width:2;}
.chip.g{background:var(--card-2);color:var(--text-2);}
.hint{font-size:11px;color:var(--text-3);line-height:1.9;padding:16px 2px;opacity:.9;}

.tool{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);background:var(--card);color:var(--text-2);font-family:inherit;font-size:12px;padding:8px 6px;border-radius:10px;cursor:pointer;transition:.15s;min-width:0;}
.tool svg{width:14px;height:14px;flex:none;}
.tool:active{background:var(--card-2);}
.tool.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak);}
.tool u{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.dtitle{width:100%;border:0;background:none;color:var(--text);font-family:inherit;font-size:20px;font-weight:550;line-height:1.5;padding:10px 2px;outline:none;}
.blk{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:0 14px;margin-bottom:13px;overflow:hidden;}
.dr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--text);min-height:46px;}
.dr:last-child{border-bottom:0;}
.dr>label{color:var(--text-2);width:52px;flex:none;font-size:12.5px;}
.dr input,.dr select{flex:1;min-width:0;background:none;border:0;color:var(--text);font-family:inherit;font-size:13.5px;outline:none;text-align:right;color-scheme:dark;}
html[data-theme="light"] .dr input,html[data-theme="light"] .dr select{color-scheme:light;}
.dr select{appearance:none;cursor:pointer;}
.seg{display:flex;gap:5px;flex:1;justify-content:flex-end;flex-wrap:wrap;}
.seg button{border:1px solid var(--line);background:none;color:var(--text-2);font-family:inherit;font-size:11.5px;padding:5px 10px;border-radius:8px;cursor:pointer;transition:.14s;}
.seg button.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:500;}
.subrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.subrow:last-of-type{border-bottom:0;}
.subrow .cbox{width:18px;height:18px;margin-top:0;}
.subrow .cbox svg{width:10px;height:10px;}
.subrow input{flex:1;background:none;border:0;outline:none;color:var(--text);font-family:inherit;font-size:13.5px;}
.addsub{background:none;border:0;color:var(--accent);font-family:inherit;font-size:12.5px;padding:11px 0;cursor:pointer;text-align:left;font-weight:500;}

.pop{position:absolute;inset:0;z-index:100;display:none;}
.pop.show{display:block;}
.popmask{position:absolute;inset:0;background:rgba(0,0,0,.5);animation:fade .2s ease;}
.popbox{position:absolute;left:14px;right:14px;bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px 16px 14px;box-shadow:0 -20px 50px -20px rgba(0,0,0,.6);animation:rise .26s var(--ease);max-height:70%;overflow-y:auto;}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.popttl{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.4px;margin-bottom:12px;}
.poprow{display:flex;align-items:center;gap:11px;padding:12px 10px;border-radius:11px;font-size:14px;color:var(--text);cursor:pointer;transition:background .14s;}
.poprow:active,.poprow.on{background:var(--card-2);}
.poprow i{width:8px;height:8px;border-radius:50%;flex:none;font-style:normal;}
.poprow span{flex:1;}
.poprow svg{width:16px;height:16px;color:var(--accent);}
.poptags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.ptag{border:1px solid var(--line);background:var(--card-2);color:var(--text-2);font-family:inherit;font-size:12px;padding:7px 12px;border-radius:9px;cursor:pointer;transition:.15s;}
.ptag.on{border-color:currentColor;font-weight:500;}
.popin{width:100%;background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;color:var(--text);font-family:inherit;font-size:13.5px;outline:none;color-scheme:dark;}
html[data-theme="light"] .popin{color-scheme:light;}
.popin::placeholder{color:var(--text-3);}
.popgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.pg{border:1px solid var(--line);background:var(--card-2);color:var(--text-2);font-family:inherit;font-size:12.5px;padding:11px;border-radius:10px;cursor:pointer;transition:.14s;}
.pg.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak);font-weight:500;}

.notif{position:absolute;top:9px;left:11px;right:11px;z-index:130;transform:translateY(-160%);transition:transform .42s var(--ease);}
.notif.show{transform:translateY(0);}
.nfi{background:var(--glass);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--line-2);border-radius:21px;padding:13px 15px;box-shadow:0 22px 50px -18px rgba(0,0,0,.7);}
.nftop{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--text-2);margin-bottom:7px;font-weight:500;}
.nfbadge{width:16px;height:16px;border-radius:5px;background:var(--accent);display:grid;place-items:center;color:#fff;}
.nfbadge svg{width:10px;height:10px;stroke-width:2.2;}
.nftitle{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px;letter-spacing:-.1px;}
.nfdesc{font-size:12px;color:var(--text-2);}
.nfacts{display:flex;gap:8px;margin-top:12px;}
.nfacts button{flex:1;border:1px solid var(--line);background:var(--card-2);color:var(--text);font-family:inherit;font-size:12px;padding:8px;border-radius:9px;cursor:pointer;font-weight:500;}
.nfacts button.pri{background:var(--accent);border-color:var(--accent);color:#fff;}

.toast{position:absolute;bottom:104px;left:50%;transform:translate(-50%,18px);opacity:0;pointer-events:none;transition:.28s var(--ease);z-index:140;background:var(--card-3);color:var(--text);padding:11px 16px;border-radius:13px;font-size:12.5px;border:1px solid var(--line-2);white-space:nowrap;box-shadow:0 16px 40px -14px rgba(0,0,0,.7);display:flex;align-items:center;}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
.toast button{background:none;border:0;color:var(--accent);font-family:inherit;font-size:12.5px;font-weight:600;margin-left:14px;cursor:pointer;}

.desk{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;padding:46px 18px 24px;overflow:hidden;
  background:radial-gradient(120% 80% at 78% -6%, var(--desk-a), var(--desk-b) 62%);}
.desk::before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;top:-70px;right:-90px;background:radial-gradient(circle,rgba(124,140,255,.32),transparent 66%);}
.desk::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;bottom:90px;left:-100px;background:radial-gradient(circle,rgba(52,211,153,.16),transparent 68%);}

function relDay(due) {
  const t = ymd(TODAY);
  if (due === t) return "今天";
  if (due === ymd(addDays(TODAY, 1))) return "明天";
  if (due === ymd(addDays(TODAY, -1))) return "昨天";
  const d = new Date(due + "T00:00:00");
  const diff = Math.round((d - TODAY) / 864e5);
  if (diff > 0 && diff < 7) return WD[d.getDay()];
  return fmtDate(due);
}
const fmtDate = due => {
  const d = new Date(due + "T00:00:00");
  const sameYear = d.getFullYear() === TODAY.getFullYear();
  return `${sameYear ? "" : d.getFullYear() + "年"}${d.getMonth() + 1}月${d.getDate()}日`;
};

  const today = all.filter(e => e.due === t).sort((a, b) => (b.priority - a.priority) || ((a.time || "99") > (b.time || "99") ? 1 : -1));
  const done = live().filter(e => e.done && e.doneAt === t);

function renderCalendar() {
  const { y, m } = state.cal;
  const first = new Date(y, m, 1);
  const offset = (first.getDay() + 6) % 7;
  const days = new Date(y, m + 1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const marked = {};
  live().filter(e => !e.done && e.due).forEach(e => { marked[e.due] = (marked[e.due] || 0) + 1; });
  let cells = "";
  for (let i = 0; i < 42; i++) {
    let day, isOut = false, dateStr;
    if (i < offset) { day = prevDays - offset + i + 1; isOut = true; dateStr = ymd(new Date(y, m - 1, day)); }
    else if (i >= offset + days) { day = i - offset - days + 1; isOut = true; dateStr = ymd(new Date(y, m + 1, day)); }
    else { day = i - offset + 1; dateStr = ymd(new Date(y, m, day)); }
    const cls = ["calcell", isOut ? "out" : "", dateStr === ymd(TODAY) ? "today" : "", dateStr === state.selDay ? "sel" : ""].filter(Boolean).join(" ");

function parseQuick(raw) {
  let s = " " + raw + " ";
  const r = { title: "", due: null, time: null, tags: [], priority: 0, repeat: null };
  s = s.replace(/#([^\s#]+)/g, (_, t) => { r.tags.push(t); return " "; });
  s = s.replace(/!!!/g, " ").replace(/!!/g, " ");
  if (/!!!/.test(raw)) r.priority = 3; else if (/!!/.test(raw)) r.priority = 2; else if (/!/.test(raw)) r.priority = 1;
  s = s.replace(/!/g, " ");
  const rm = s.match(/每\s*(\d{1,4})?\s*(天|周|月|年)(?:一次)?/);
  if (rm) {
    r.repeat = { freq: ({ "天": "day", "周": "week", "月": "month", "年": "year" })[rm[2]], n: clampN(rm[1]) };
    s = s.replace(rm[0], " ");
  }
  const wmap = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "日": 0, "天": 0 };
  const nextWD = (target, nextWeek) => {
    const cur = TODAY.getDay();
    if (nextWeek) {
      const monday = addDays(TODAY, -((cur + 6) % 7));
      return addDays(monday, 7 + ((target + 6) % 7));
    }
    let diff = (target - cur + 7) % 7;
    if (!diff) diff = 7;
    return addDays(TODAY, diff);
  };
  let d = null, m, yearShift = 0, yearWord = false;
  if (m = s.match(/后年/)) { yearShift = 2; yearWord = true; s = s.replace(/后年/g, " "); }
  else if (m = s.match(/明年/)) { yearShift = 1; yearWord = true; s = s.replace(/明年/g, " "); }
  else if (m = s.match(/今年/)) { yearShift = 0; yearWord = true; s = s.replace(/今年/g, " "); }
  let explicitYear = false;
  if (m = s.match(/(今天|今晚|今早)/)) { d = new Date(TODAY); s = s.replace(m[0], " "); }
  else if (m = s.match(/(明天|明早|明晚)/)) { d = addDays(TODAY, 1); s = s.replace(m[0], " "); }
  else if (m = s.match(/后天/)) { d = addDays(TODAY, 2); s = s.replace(/后天/, " "); }
  else if (m = s.match(/下周([一二三四五六日天])/)) { d = nextWD(wmap[m[1]], true); s = s.replace(m[0], " "); }
  else if (m = s.match(/(?:周|星期)([一二三四五六日天])/)) { d = nextWD(wmap[m[1]], false); s = s.replace(m[0], " "); }
  else if (m = s.match(/(?:(\d{2,4})年)?(\d{1,2})月(\d{1,2})[日号]/)) {
    let y = m[1] ? (m[1].length === 2 ? 2000 + +m[1] : +m[1]) : TODAY.getFullYear() + yearShift;
    d = new Date(y, +m[2] - 1, +m[3]);
    explicitYear = !!m[1] || yearWord;
    s = s.replace(m[0], " ");
  }
  if (d && !explicitYear && d < TODAY) d.setFullYear(d.getFullYear() + 1);
  let t = null;
  const pm = /下午|晚上|傍晚|今晚|明晚/.test(s);
  if (m = s.match(/(\d{1,2})[:：](\d{2})/)) { t = pad(+m[1]) + ":" + m[2]; s = s.replace(m[0], " "); }
  else if (m = s.match(/(\d{1,2})点(半|\d{1,2}分?)?/)) {
    let h = +m[1];
    const mm = m[2] === "半" ? 30 : (m[2] ? parseInt(m[2]) : 0);
    if (pm && h < 12) h += 12;
    t = pad(h) + ":" + pad(mm);
    s = s.replace(m[0], " ");
  }
  s = s.replace(/上午|下午|晚上|傍晚/g, " ");
  r.title = s.replace(/\s+/g, " ").trim();
  if (d) r.due = ymd(d);
  r.time = t;
  if (t && !r.due) r.due = ymd(TODAY);
  return r;
}

function updateParse() {
  const el = document.getElementById("qTitle");
  if (!el) return;
  const p = parseQuick(el.value);
  const q = state.quick;
  const due = p.due || q.due;
  const time = p.time || q.time;
  const tags = [...new Set([...p.tags, ...q.tags])];
  const pri = q.priority || p.priority;
  const bar = document.getElementById("parseBar");
  if (!bar) return;
  const chips = [];
  if (due) chips.push(`<span class="chip">${ic("clock")}${relDay(due)}${time ? " " + time : ""}</span>`);
  const rtx = repeatText(p.repeat || q.repeat);
  if (rtx) chips.push(`<span class="chip">${ic("sync")}${rtx}</span>`);
  if (pri) chips.push(`<span class="chip">${ic("flag")}${["", "低", "中", "高"][pri]}优先级</span>`);
  if (q.listId) chips.push(`<span class="chip g">${esc(listName(q.listId))}</span>`);
  tags.forEach(t => chips.push(`<span class="chip g" style="color:${tagColor(t)}">#${esc(t)}</span>`));
  bar.innerHTML = chips.join("");
}

  el.innerHTML = `<div class="popmask" data-act="popClose"></div><div class="popbox">${body}</div>`;
  el.classList.add("show");
  const focusMap = { tag: "newTag", list: "newList", listEdit: "popListName", tagEdit: "popTagName" };
  if (focusMap[k]) setTimeout(() => { const i = document.getElementById(focusMap[k]); if (i) i.focus(); }, 40);
}

function toast(msg, actLabel, act) {

const nextDue = (due, r) => {
  const src = new Date(due + "T00:00:00");
  const y = src.getFullYear(), mo = src.getMonth(), day = src.getDate();
  if (r.freq === "day") return ymd(addDays(src, r.n));
  if (r.freq === "week") return ymd(addDays(src, r.n * 7));
  const addM = r.freq === "month" ? r.n : r.n * 12;
  const total = mo + addM;
  const ny = y + Math.floor(total / 12), nm = ((total % 12) + 12) % 12;
  const last = new Date(ny, nm + 1, 0).getDate();
  return ymd(new Date(ny, nm, Math.min(day, last)));
};

function toggleDone(id) {
  const e = get(id); if (!e) return;
  const r = normRepeat(e.repeat);
  if (!e.done && r.freq !== "none" && e.due) {
    state.entries.push({ ...e, id: nid(), done: true, doneAt: ymd(TODAY), repeat: { freq: "none", n: 1 }, deletedAt: null });
    e.due = nextDue(e.due, r);
    save(); renderAll();
    if (state.desktop) { const d = document.getElementById("deskLayer"); if (d) d.innerHTML = renderDesktop(); }
    toast(`已完成本次，下次 ${fmtDate(e.due)}`);
    return;
  }
  e.done = !e.done;
  e.doneAt = e.done ? ymd(TODAY) : null;
  save();
  renderAll();
  if (state.desktop) { const d = document.getElementById("deskLayer"); if (d) d.innerHTML = renderDesktop(); }
}

    put("--desk-glass", V2rgba(dark ? "#1a202c" : "#ffffff", dark ? .6 : .72));
    put("--desk-line", dark ? "rgba(255,255,255,.12)" : "rgba(17,24,44,.08)");
    put("--page-a", V2mix(bg, c.accent, dark ? .12 : .06));
    put("--page-b", dark ? V2mix(bg, "#000000", .2) : V2mix(bg, "#101526", .05));
    put("--shadow", dark ? "0 24px 60px -24px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.05)" : "0 24px 60px -30px rgba(24,36,70,.35), 0 0 0 1px rgba(17,24,44,.05)");
    document.documentElement.dataset.motion = c.motion ? "on" : "off";
    document.documentElement.dataset.theme = c.base;
    state.theme = c.base;
  },
  all() { return [...THEMES, ...this.custom]; },
  cards() {
    return this.all().map(p => `<button class="thm ${this.activeK === p.k ? "on" : ""}" data-act="setTheme" data-t="${p.k}"><span class="sw" style="background:${p.sw}"><i style="background:${p.bar}"></i><u style="background:${p.bar}"></u></span><em>${esc(p.name)}</em></button>`).join("");
  },
  preset(k) {
    const p = this.all().find(x => x.k === k);
    if (!p) return;
    this.cfg = this.from(p);
    this.activeK = k;
    this.apply();
    save();
    this.persist();
    renderAll();
    if (document.getElementById("lab").classList.contains("open")) this.renderLab();
  },
  liveSet(k, v) {
    this.cfg[k] = v;
    this.activeK = "custom";
    this.apply();
    this.persist();
    const lab = document.getElementById("lab");
    lab.querySelectorAll(".lab-p").forEach(x => x.classList.remove("on"));
    lab.querySelectorAll(".lab-sw").forEach(x => x.classList.toggle("on", x.dataset.c === String(v).toLowerCase()));
    const val = lab.querySelector(`[data-labv="${k}"]`);
    if (val) val.textContent = v + (k === "glow" ? "%" : "px");
  },
  set(k, v) {
    this.cfg[k] = v;
    this.activeK = "custom";
    this.apply();
    save();
    this.persist();
    this.renderLab();
  },
  setBase(v) {
    this.cfg.base = v;
    this.cfg.bg = v === "dark" ? "#0b0c10" : "#f7f8fc";
    this.activeK = "custom";
    this.apply();
    save();
    this.persist();
    this.renderLab();
    renderAll();
  },
  saveCustom() {
    const el = document.getElementById("labName");
    const name = ((el && el.value.trim()) || "我的主题").slice(0, 12);
    const k = "own" + Date.now().toString(36);
    const p = { ...this.from(this.cfg), k, name, own: true, sw: `linear-gradient(150deg,${V2mix(this.cfg.bg, this.cfg.accent, .35)},${this.cfg.bg})`, bar: this.cfg.accent };
    this.custom.push(p);
    try { localStorage.setItem(this.ckey, JSON.stringify(this.custom)); } catch (e) {}
    this.activeK = k;
    this.persist();
    this.renderLab();
    renderAll();
    toast("主题「" + name + "」已保存");
  },
  delCustom(k) {
    this.custom = this.custom.filter(x => x.k !== k);
    try { localStorage.setItem(this.ckey, JSON.stringify(this.custom)); } catch (e) {}
    if (this.activeK === k) this.preset(THEMES[0].k);
    else { this.renderLab(); renderAll(); }
  },
  openLab() { this.renderLab(); document.getElementById("lab").classList.add("open"); },
  closeLab() { document.getElementById("lab").classList.remove("open"); renderAll(); },
  renderLab() {
    const c = this.cfg, lab = document.getElementById("lab");
    const ps = this.all().map(p => `<button class="lab-p ${this.activeK === p.k ? "on" : ""}" data-lab="preset" data-k="${p.k}"><i style="background:${p.sw};--dot:${p.bar}"></i><em>${esc(p.name)}</em>${p.own ? `<span class="del" data-lab="del" data-k="${p.k}">×</span>` : ""}</button>`).join("");
    const sw = V2SW.map(x => `<button class="lab-sw ${c.accent.toLowerCase() === x ? "on" : ""}" data-lab="sw" data-c="${x}" style="background:${x}"></button>`).join("");
    lab.innerHTML = `<div class="lab-head"><b>主题实验室</b><button class="ibtn" data-lab="close">${ic("close")}</button></div>
      <div class="lab-body">
        <div class="lab-sec">预设主题<span>${this.all().length} 套 · 点击即应用</span></div>
        <div class="lab-presets">${ps}</div>
        <div class="lab-sec">自定义<span>实时生效</span></div>
        <div class="lab-row"><label>明暗</label><div class="lab-seg"><button class="${c.base === "dark" ? "on" : ""}" data-lab="base" data-v="dark">深色</button><button class="${c.base === "light" ? "on" : ""}" data-lab="base" data-v="light">浅色</button></div></div>
        <div class="lab-row"><label>强调色</label><input type="color" data-labf="accent" value="${c.accent}"><span class="val">取色</span></div>
        <div class="lab-swatches">${sw}</div>
        <div class="lab-row"><label>背景色</label><input type="color" data-labf="bg" value="${c.bg}"><span style="flex:1;font-size:11px;color:var(--text-3)">卡片与文字自动推导</span></div>
        <div class="lab-row"><label>辉光强度</label><input type="range" min="0" max="100" value="${c.glow}" data-labf="glow"><span class="val" data-labv="glow">${c.glow}%</span></div>
        <div class="lab-row"><label>圆角</label><input type="range" min="8" max="28" value="${c.radius}" data-labf="radius"><span class="val" data-labv="radius">${c.radius}px</span></div>
        <div class="lab-row"><label>流光动效</label><span style="flex:1;font-size:11px;color:var(--text-3)">光斑漂移 · 辉光呼吸</span><button class="switch ${c.motion ? "on" : ""}" data-lab="motion"></button></div>
      </div>
      <div class="lab-foot"><input id="labName" placeholder="给这套主题起个名" maxlength="12"><button class="lab-btn ghost" data-lab="reset">重置</button><button class="lab-btn" data-lab="save">保存主题</button></div>`;
  }
};

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-lab]");
  if (!b) return;
  const a = b.dataset.lab;
  if (a === "open") { V2.openLab(); return; }
  if (a === "close") { V2.closeLab(); return; }
  if (a === "preset") { V2.preset(b.dataset.k); return; }
  if (a === "base") { V2.setBase(b.dataset.v); return; }
  if (a === "sw") { V2.set("accent", b.dataset.c); return; }
  if (a === "motion") { V2.set("motion", !V2.cfg.motion); return; }
  if (a === "reset") { V2.preset(THEMES[0].k); return; }
  if (a === "save") { V2.saveCustom(); return; }
  if (a === "del") { V2.delCustom(b.dataset.k); return; }
});
document.addEventListener("input", ev => {
  const t = ev.target, f = t.dataset.labf;
  if (!f) return;
  V2.liveSet(f, (f === "glow" || f === "radius") ? +t.value : t.value);
});

load();
V2.init();
renderAll();
tick();
setInterval(tick, 15000);
fit();
window.addEventListener("resize", fit);
</script>
</body>
</html>
